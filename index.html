<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F3;
    --card:#FFFDF9;
    --ink:#2B2B26;
    --ink-soft:#63604F;
    --mustard:#C89B3C;
    --mustard-deep:#A97F27;
    --sage:#5B6B4F;
    --line:#E5DFCF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  header{
    padding:28px 20px 18px;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:10;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--sage);
    font-weight:600;
    margin-bottom:4px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:32px;
    margin:0 0 16px;
    letter-spacing:-0.01em;
  }
  .search-wrap{
    position:relative;
  }
  #search{
    width:100%;
    padding:13px 16px 13px 40px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
  }
  #search:focus{border-color:var(--mustard);}
  .search-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--ink-soft);
    font-size:15px;
    pointer-events:none;
  }
  main{
    padding:20px 16px 60px;
    max-width:640px;
    margin:0 auto;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }
  @media(min-width:520px){
    .grid{grid-template-columns:1fr 1fr;}
  }
  .rcard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    cursor:pointer;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .rcard:active{transform:scale(0.98);}
  .tab{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--mustard-deep);
    background:rgba(200,155,60,0.14);
    border-radius:5px;
    padding:3px 8px;
    margin-bottom:10px;
  }
  .rcard h3{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:600;
    margin:0 0 8px;
    line-height:1.25;
  }
  .meta{
    display:flex;
    gap:12px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }

  /* Detail view */
  #detail{
    display:none;
    max-width:640px;
    margin:0 auto;
    padding:0 16px 60px;
  }
  .back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--sage);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    padding:20px 0 10px;
  }
  .detail-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px 22px 28px;
  }
  .detail-card h2{
    font-family:'Fraunces',serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 10px;
    line-height:1.2;
  }
  .detail-meta{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:20px;
    padding-bottom:18px;
    border-bottom:1px dashed var(--line);
  }
  .detail-meta span strong{color:var(--ink);font-weight:600;}
  h4.section{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--sage);
    font-weight:600;
    margin:22px 0 10px;
  }
  ul.ingredients{
    list-style:none;
    margin:0;
    padding:0;
  }
  ul.ingredients li{
    display:flex;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
  }
  ul.ingredients li:last-child{border-bottom:none;}
  .qty{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    color:var(--mustard-deep);
    min-width:64px;
    flex-shrink:0;
    font-size:13.5px;
  }
  ol.steps{
    margin:0;
    padding:0;
    list-style:none;
    counter-reset:step;
  }
  ol.steps li{
    counter-increment:step;
    display:flex;
    gap:14px;
    padding:12px 0;
    font-size:14.5px;
    line-height:1.55;
  }
  ol.steps li::before{
    content:counter(step);
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:var(--mustard);
    background:rgba(200,155,60,0.14);
    border-radius:50%;
    width:26px;
    height:26px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .note{
    margin-top:20px;
    padding-top:16px;
    border-top:1px dashed var(--line);
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Recipe Box</div>
  <h1>What's cooking</h1>
  <div class="search-wrap">
    <span class="search-icon">&#8981;</span>
    <input id="search" type="text" placeholder="Search recipes or ingredients">
  </div>
</header>

<main id="listView">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">No recipes match that search.</div>
</main>

<div id="detail"></div>

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const listView = document.getElementById('listView');
const detail = document.getElementById('detail');
const search = document.getElementById('search');

function renderGrid(items){
  grid.innerHTML = '';
  if(items.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  items.forEach(r => {
    const card = document.createElement('div');
    card.className = 'rcard';
    card.innerHTML = `
      <span class="tab">${r.tag}</span>
      <h3>${r.title}</h3>
      <div class="meta">
        <span>&#9202; ${r.cookTime}</span>
        <span>&#127860; ${r.servings} serv</span>
      </div>
    `;
    card.addEventListener('click', () => showDetail(r.id));
    grid.appendChild(card);
  });
}

function showDetail(id){
  const r = recipes.find(x => x.id === id);
  if(!r) return;
  listView.style.display = 'none';
  detail.style.display = 'block';
  detail.innerHTML = `
    <button class="back" id="backBtn">&#8592; Back to recipe box</button>
    <div class="detail-card">
      <span class="tab">${r.tag}</span>
      <h2>${r.title}</h2>
      <div class="detail-meta">
        <span>&#9202; <strong>${r.cookTime}</strong></span>
        <span>&#127860; <strong>${r.servings}</strong> servings</span>
        <span>&#128202; <strong>${r.calories}</strong></span>
      </div>
      <h4 class="section">Ingredients</h4>
      <ul class="ingredients">
        ${r.ingredients.map(i => `<li><span class="qty">${i.qty}</span><span>${i.name}</span></li>`).join('')}
      </ul>
      <h4 class="section">Method</h4>
      <ol class="steps">
        ${r.steps.map(s => `<li>${s}</li>`).join('')}
      </ol>
      ${r.note ? `<div class="note">${r.note}</div>` : ''}
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => {
    detail.style.display = 'none';
    listView.style.display = 'block';
    window.scrollTo(0,0);
  });
  window.scrollTo(0,0);
}

search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  if(!q){
    renderGrid(recipes);
    return;
  }
  const filtered = recipes.filter(r => {
    const inTitle = r.title.toLowerCase().includes(q);
    const inIngredients = r.ingredients.some(i => i.name.toLowerCase().includes(q));
    return inTitle || inIngredients;
  });
  renderGrid(filtered);
});

renderGrid(recipes);
</script>
